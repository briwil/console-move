<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c0e">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>Console</title>
<style>
  :root {
    --bg: #0b0c0e; --panel: #131519; --line: #23262d; --dim: #5c616c; --text: #e8e9ec; --soft: #a3a8b3;
    --amber: #f2b33d; --red: #ff5a4e; --green: #49d17d; --orange: #ff9a3c;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #offline { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 1.2vh; background: rgba(11,12,14,.92); font-size: 2.4vh; color: var(--soft); text-align: center; }
  #offline b { color: var(--text); font-size: 3.2vh; font-weight: 600; }
  #fs { position: fixed; left: 50%; top: 1.6vh; transform: translateX(-50%); padding: .8vh 1.2vw; border-radius: 1vh; border: 1px solid var(--line);
    background: var(--panel); color: var(--soft); font-size: 1.6vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="offline"><b>Looking for Console…</b><span>The Move and this device need to be on the same Wi-Fi (or this phone's hotspot),<br>with Console running.</span></div>
<button id="fs">Full screen</button>
<script>
"use strict";
const cv = document.getElementById("c"), g = cv.getContext("2d");
const COLORS = ["#f2b33d", "#4fb3ff", "#ff6b9a", "#49d17d", "#b38cff", "#ff9a3c", "#36d6c8", "#e6e36a"];
let SEQ = null, SEQ_ID = "", seqWant = "";
let S = null, got = 0, waves = {}, want = {}, fails = 0, dpr = 1, W = 0, H = 0, screenImg = null, screenKey = "";

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
  cv.width = W; cv.height = H;
}
addEventListener("resize", resize); resize();

document.getElementById("fs").onclick = () => {
  const el = document.documentElement;
  (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  try { screen.orientation.lock("landscape"); } catch (e) {}
};
document.addEventListener("fullscreenchange", () => {
  document.getElementById("fs").style.display = document.fullscreenElement ? "none" : "";
});

async function poll() {
  try {
    const r = await fetch("/state", {cache: "no-store"});
    S = await r.json(); got = performance.now(); fails = 0;
    document.getElementById("offline").style.display = "none";
    for (const t of S.tracks) for (const id of t.waves) if (!waves[id] && !want[id]) loadWave(id);
    if (S.page === "seq" && S.seq_id && S.seq_id !== SEQ_ID && seqWant !== S.seq_id) loadSeq(S.seq_id);
  } catch (e) {
    if (++fails > 8) document.getElementById("offline").style.display = "flex";
  }
  setTimeout(poll, 66);
}
async function loadWave(id) {
  want[id] = 1;
  try {
    const r = await fetch("/wave/" + id);
    const buf = new Uint8Array(await r.arrayBuffer());
    const ch = id.split(":")[0];
    for (const k of Object.keys(waves)) if (k.split(":")[0] === ch && k !== id) delete waves[k];
    waves[id] = buf;
  } catch (e) {}
  delete want[id];
}
async function loadSeq(id) {
  seqWant = id;
  try { const r = await fetch("/seq/" + id); if (r.ok) { SEQ = await r.json(); SEQ_ID = id; } } catch (e) {}
  seqWant = "";
}
poll();

function pos() {                       // the playhead, moved on between the Move's updates while playing
  if (!S) return 0;
  return S.playing ? S.pos + Math.min(0.5, (performance.now() - got) / 1000) * S.bpm / 60 : S.pos;
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function text(s, x, y, size, color, weight, align, font) {
  g.font = (weight || 400) + " " + Math.round(size) + "px " + (font || "system-ui, -apple-system, Roboto, sans-serif");
  g.fillStyle = color; g.textAlign = align || "left"; g.textBaseline = "middle"; g.fillText(s, x, y);
}
const MONO = "ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace";

function draw() {
  requestAnimationFrame(draw);
  g.fillStyle = "#0b0c0e"; g.fillRect(0, 0, W, H);
  if (!S) return;
  const u = Math.min(W / 2448, H / 1848) * 1.0;          // one unit: the Fold's open screen at 1
  const pad = 28 * u, P = pos();
  // ---------------------------------------------------------------- the top line
  const topH = 120 * u;
  const st = S.recording ? (S.overdub ? "ODUB" : "REC") : S.playing ? "PLAY" : "STOP";
  const stc = S.recording ? (S.overdub ? "#ff9a3c" : "#ff5a4e") : S.playing ? "#49d17d" : "#5c616c";
  rr(pad, pad, 190 * u, 76 * u, 18 * u); g.fillStyle = stc; g.fill();
  text(st, pad + 95 * u, pad + 39 * u, 40 * u, "#0b0c0e", 800, "center");
  text(S.position, pad + 230 * u, pad + 40 * u, 66 * u, "#e8e9ec", 600, "left", MONO);
  let x = pad + 230 * u + g.measureText(S.position).width + 44 * u;
  text(S.bpm.toFixed(S.bpm % 1 ? 1 : 0) + " BPM", x, pad + 40 * u, 38 * u, "#a3a8b3", 500); x += g.measureText(S.bpm + " BPM").width + 34 * u;
  text(S.sig[0] + "/" + S.sig[1], x, pad + 40 * u, 38 * u, "#a3a8b3", 500); x += 110 * u;
  const badge = (label, on, color) => {
    g.font = "700 " + Math.round(26 * u) + "px system-ui"; const w = g.measureText(label).width + 36 * u;
    rr(x, pad + 18 * u, w, 44 * u, 12 * u); g.fillStyle = on ? color : "#1a1d22"; g.fill();
    text(label, x + w / 2, pad + 40 * u, 26 * u, on ? "#0b0c0e" : "#5c616c", 700, "center"); x += w + 14 * u;
  };
  badge("LOOP", S.loop_on && S.loop, "#f2b33d");
  if (S.song_mode) badge("SONG", true, "#b38cff");
  text(S.song || "NEW PROJECT", W - pad, pad + 40 * u, 38 * u, S.song ? "#e8e9ec" : "#5c616c", 600, "right");

  const footH = 250 * u;
  if (S.page === "seq" && SEQ && S.seq) {
    drawSeq(u, pad, topH + 6 * u, H - footH - 16 * u);
  } else {
  // ---------------------------------------------------------------- the whole tape, small
  const ovY = topH + 6 * u, ovH = 64 * u, gutter = 300 * u, X0 = pad + gutter, X1 = W - pad;
  const span = (S.zoom || 4) * S.bar, ppb = (X1 - X0) / span, mid = X0 + (X1 - X0) / 2;
  const viewA = P - span / 2, viewB = P + span / 2;
  const total = Math.max(S.length, 8);
  rr(X0, ovY, X1 - X0, ovH, 10 * u); g.fillStyle = "#131519"; g.fill();
  const lh = ovH / 8;
  S.tracks.forEach((t, i) => {
    for (const b of t.boxes) {
      const a = X0 + b[0] / total * (X1 - X0), w = Math.max(2 * u, (b[1] - b[0]) / total * (X1 - X0));
      g.fillStyle = COLORS[i] + (t.audible ? "cc" : "44"); g.fillRect(a, ovY + i * lh + 1 * u, w, lh - 2 * u);
    }
  });
  if (S.loop) { g.fillStyle = "rgba(242,179,61,.18)"; g.fillRect(X0 + S.loop[0] / total * (X1 - X0), ovY, (S.loop[1] - S.loop[0]) / total * (X1 - X0), ovH); }
  g.strokeStyle = "#e8e9ec"; g.lineWidth = 2 * u;
  g.strokeRect(X0 + Math.max(0, viewA) / total * (X1 - X0), ovY + 1 * u, span / total * (X1 - X0), ovH - 2 * u);
  g.fillStyle = "#ff5a4e"; g.fillRect(X0 + P / total * (X1 - X0) - 1.5 * u, ovY, 3 * u, ovH);
  text("TAPE", pad + 4 * u, ovY + ovH / 2, 26 * u, "#5c616c", 700);

  // ---------------------------------------------------------------- the 8 tracks
  const tY = ovY + ovH + 22 * u, tH = H - footH - tY - 10 * u, rowH = tH / 8;
  const rulerH = 40 * u;
  // bar numbers and grid
  g.save(); g.beginPath(); g.rect(X0, tY - 4 * u, X1 - X0, tH + 8 * u); g.clip();
  const firstBar = Math.floor(viewA / S.bar) - 1;
  for (let k = firstBar; k * S.bar <= viewB + S.bar; k++) {
    for (let bt = 0; bt < S.bar; bt += S.unit || 1) {
      const bx = mid + (k * S.bar + bt - P) * ppb;
      if (bx < X0 - 2 || bx > X1 + 2) continue;
      g.fillStyle = bt === 0 ? "#2b2f37" : "#181b20"; g.fillRect(bx, tY + rulerH, bt === 0 ? 2 * u : 1 * u, tH - rulerH);
      if (bt === 0 && k >= 0) text(String(k + 1), bx + 8 * u, tY + rulerH / 2, 26 * u, "#7c818c", 600, "left", MONO);
    }
  }
  if (S.loop) {
    const a = mid + (S.loop[0] - P) * ppb, b = mid + (S.loop[1] - P) * ppb;
    g.fillStyle = S.loop_on ? "rgba(242,179,61,.10)" : "rgba(242,179,61,.04)"; g.fillRect(a, tY + rulerH, b - a, tH - rulerH);
    g.fillStyle = S.loop_on ? "#f2b33d" : "#7a6330";
    for (const lx of [a, b]) g.fillRect(lx - 1.5 * u, tY + 6 * u, 3 * u, tH - 6 * u);
    g.fillRect(a, tY + 6 * u, b - a, 6 * u);
  }
  g.restore();
  const laneTop = tY + rulerH, laneH = (tH - rulerH) / 8;
  S.tracks.forEach((t, i) => {
    const y = laneTop + i * laneH, h = laneH - 10 * u, col = COLORS[i];
    // the label
    rr(pad, y, gutter - 22 * u, h, 16 * u);
    g.fillStyle = t.selected ? "#1d2027" : "#131519"; g.fill();
    if (t.selected) { g.strokeStyle = col; g.lineWidth = 3 * u; g.stroke(); }
    text(String(t.n), pad + 46 * u, y + h * 0.42, Math.min(64 * u, h * 0.55), t.audible ? col : "#3d4148", 800, "center");
    const chips = [];
    if (t.armed) chips.push(["●", "#ff5a4e"]);
    if (t.muted) chips.push(["M", "#5c616c"]);
    if (t.solo) chips.push(["S", "#f2b33d"]);
    if (t.stereo) chips.push(["ST", "#4fb3ff"]);
    let cx = pad + 92 * u;
    for (const [lab, cc] of chips) { text(lab, cx, y + h * 0.3, 26 * u, cc, 800); g.font = "800 " + Math.round(26 * u) + "px system-ui"; cx += g.measureText(lab).width + 14 * u; }
    // volume bar, pan dot
    const vx = pad + 92 * u, vw = gutter - 140 * u, vy = y + h * 0.58;
    g.fillStyle = "#23262d"; g.fillRect(vx, vy, vw, 8 * u);
    g.fillStyle = t.audible ? col : "#3d4148"; g.fillRect(vx, vy, vw * Math.min(1, t.vol), 8 * u);
    g.fillStyle = "#a3a8b3"; g.fillRect(vx + vw / 2 + t.pan * vw / 2 - 2 * u, vy + 14 * u, 4 * u, 10 * u);
    if (t.armed && t.peak > 0) { g.fillStyle = t.peak > 0.95 ? "#ff5a4e" : "#49d17d"; g.fillRect(vx, vy - 14 * u, vw * Math.min(1, t.peak), 6 * u); }
    if (h > 110 * u) text(t.input.slice(0, 26), pad + 22 * u, y + h - 22 * u, 20 * u, "#5c616c", 500);
    // the lane
    g.save(); g.beginPath(); g.rect(X0, y, X1 - X0, h); g.clip();
    g.fillStyle = t.selected ? "#121419" : "#0e1013"; g.fillRect(X0, y, X1 - X0, h);
    const halves = t.stereo && t.waves.length > 1 ? 2 : 1;
    for (const b of t.boxes) {
      const a = mid + (b[0] - P) * ppb, z = mid + (b[1] - P) * ppb;
      if (z < X0 || a > X1) continue;
      rr(a + 1 * u, y + 2 * u, Math.max(2 * u, z - a - 2 * u), h - 4 * u, 10 * u);
      g.fillStyle = col + (t.audible ? "2e" : "12"); g.fill();
      g.strokeStyle = col + (t.audible ? "aa" : "40"); g.lineWidth = 2 * u; g.stroke();
      for (let s = 0; s < halves; s++) {
        const lv = waves[t.waves[s]];
        if (!lv) continue;
        const hy = y + 6 * u + s * (h - 12 * u) / halves, hh = (h - 12 * u) / halves, cy = hy + hh / 2;
        g.fillStyle = col + (t.audible ? "ff" : "55");
        const xa = Math.max(X0, a + 3 * u), xb = Math.min(X1, z - 3 * u), step = Math.max(1, Math.round(2 * u));
        for (let px = xa; px < xb; px += step) {
          const b0 = P + (px - mid) / ppb, b1 = P + (px + step - mid) / ppb;
          let i0 = Math.floor(b0 * S.res), i1 = Math.max(i0 + 1, Math.floor(b1 * S.res)), m = 0;
          for (let k = Math.max(0, i0); k < Math.min(lv.length, i1); k++) if (lv[k] > m) m = lv[k];
          const v = m / 255 * (hh / 2 - 2 * u);
          if (v > 0.5) g.fillRect(px, cy - v, step, v * 2);
        }
      }
    }
    g.restore();
  });
  // the playhead
  g.fillStyle = S.recording ? "#ff5a4e" : "#e8e9ec";
  g.fillRect(mid - 2 * u, tY, 4 * u, tH);
  g.beginPath(); g.moveTo(mid - 14 * u, tY); g.lineTo(mid + 14 * u, tY); g.lineTo(mid, tY + 18 * u); g.fill();

  }
  // ---------------------------------------------------------------- the bottom: the Move's own screen, the message
  const fy = H - footH + 10 * u, sh = footH - 30 * u, sw = sh * 2;
  rr(W - pad - sw - 16 * u, fy - 8 * u, sw + 16 * u, sh + 16 * u, 14 * u); g.fillStyle = "#131519"; g.fill();
  if (S.screen) {
    if (S.screen !== screenKey) {
      screenKey = S.screen;
      const raw = atob(S.screen), img = g.createImageData(128, 64);
      for (let yy = 0; yy < 64; yy++) for (let xx = 0; xx < 128; xx++) {
        const on = (raw.charCodeAt(yy * 16 + (xx >> 3)) >> (7 - (xx & 7))) & 1, o = (yy * 128 + xx) * 4;
        img.data[o] = on ? 232 : 14; img.data[o + 1] = on ? 233 : 16; img.data[o + 2] = on ? 236 : 19; img.data[o + 3] = 255;
      }
      const oc = document.createElement("canvas"); oc.width = 128; oc.height = 64; oc.getContext("2d").putImageData(img, 0, 0);
      screenImg = oc;
    }
    g.imageSmoothingEnabled = false;
    if (screenImg) g.drawImage(screenImg, W - pad - sw - 8 * u, fy, sw, sh);
  }
  const sel = S.page === "seq" ? null : S.tracks.find(t => t.selected);     // (the sequencer: its own header says it)
  if (sel) {
    const pan = Math.abs(sel.pan) < 0.05 ? "C" : (sel.pan < 0 ? "L" : "R") + Math.round(Math.abs(sel.pan) * 100);
    text("TRACK " + sel.n, pad, fy + 34 * u, 44 * u, COLORS[sel.n - 1], 800);
    text("VOL " + Math.round(sel.vol * 100) + "   PAN " + pan + (sel.stereo ? "   STEREO" : "") + (sel.armed ? "   ARMED" : ""),
         pad + 250 * u, fy + 34 * u, 34 * u, "#a3a8b3", 600);
    text("IN  " + sel.input, pad, fy + 96 * u, 30 * u, "#7c818c", 500);
  }
  if (S.message) {
    rr(pad, fy + 140 * u, W - 2 * pad - sw - 50 * u, 76 * u, 14 * u); g.fillStyle = "#1d2027"; g.fill();
    text(S.message.slice(0, 90), pad + 24 * u, fy + 178 * u, 32 * u, "#e8e9ec", 600);
  }
}
requestAnimationFrame(draw);

// ------------------------------------------------------------------ the sequencer
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
function seqHeader(u, pad, y, title, sub, accent) {
  text(title, pad, y + 30 * u, 46 * u, accent, 800);
  g.font = "800 " + Math.round(46 * u) + "px system-ui"; const w = g.measureText(title).width;
  text(sub, pad + w + 30 * u, y + 32 * u, 32 * u, "#a3a8b3", 600);
  const L = S.seq, pat = "PATTERN " + L.pattern + (L.queued ? "  →  " + L.queued : "");
  text(pat, W - pad, y + 32 * u, 36 * u, L.queued ? "#f2b33d" : "#e8e9ec", 700, "right");
  if (L.rec) { g.font = "700 " + Math.round(36 * u) + "px system-ui"; const pw = g.measureText(pat).width;
    text("● REC", W - pad - pw - 40 * u, y + 32 * u, 32 * u, "#ff5a4e", 800, "right"); }
}

function drawSeq(u, pad, y0, y1) {
  const L = S.seq;
  if (SEQ.kind === "drums") drawDrums(u, pad, y0, y1, L); else drawNotes(u, pad, y0, y1, L);
}

function drawDrums(u, pad, y0, y1, L) {
  const lanes = SEQ.lanes, sel = Math.min(L.lane || 0, lanes.length - 1);
  seqHeader(u, pad, y0, SEQ.title, lanes[sel] ? lanes[sel].name : "", "#f2b33d");
  const top = y0 + 80 * u, gutter = 300 * u, rightW = 150 * u, X0 = pad + gutter, X1 = W - pad - rightW;
  const cols = Math.max(16, ...lanes.map(l => l.length));
  const cw = (X1 - X0) / cols, rh = Math.min(120 * u, (y1 - top) / lanes.length);
  // step numbers along the top
  for (let i = 0; i < cols; i++) if (i % 4 === 0) text(String(i + 1), X0 + i * cw + 6 * u, top - 14 * u, 22 * u, "#5c616c", 600, "left", MONO);
  lanes.forEach((ln, li) => {
    const y = top + li * rh, h = rh - 8 * u, col = COLORS[li % COLORS.length], isSel = li === sel;
    rr(pad, y, gutter - 22 * u, h, 14 * u); g.fillStyle = isSel ? "#1d2027" : "#131519"; g.fill();
    if (isSel) { g.strokeStyle = col; g.lineWidth = 3 * u; g.stroke(); }
    text(ln.name.slice(0, 14), pad + 20 * u, y + h / 2, Math.min(32 * u, h * 0.42), isSel ? "#e8e9ec" : "#a3a8b3", 700);
    text(ln.rate + "  " + ln.length + (ln.hits ? "  E" + ln.hits : ""), X1 + 18 * u, y + h / 2, 24 * u, "#5c616c", 600, "left", MONO);
    // the 16 the buttons show, for the picked lane
    if (isSel) { const a = X0 + L.first * cw, w = Math.min(16, ln.length - L.first) * cw;
      g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(a, y - 3 * u, w, h + 6 * u); }
    const at = L.at ? L.at[li] : null;
    for (let i = 0; i < ln.length; i++) {
      const s = ln.steps[i], x = X0 + i * cw, gap = Math.max(2 * u, cw * 0.1);
      const bx = x + gap / 2, bw = cw - gap, by = y, bh = h;
      if (ln.group && i % ln.group === 0 && i) { g.fillStyle = "#2b2f37"; g.fillRect(x - 1 * u, y - 4 * u, 2 * u, h + 8 * u); }
      rr(bx, by, bw, bh, Math.min(10 * u, bw / 4));
      if (s[0]) {
        const v = s[1] ? s[1] / 127 : 0.75;
        g.globalAlpha = 0.35 + 0.65 * v; g.fillStyle = col; g.fill(); g.globalAlpha = 1;
        if (!s[1]) text("?", bx + bw / 2, by + bh / 2, Math.min(bh, bw) * 0.5, "#0b0c0e", 800, "center");
        // velocity as a bar inside, ratchets as dots, chance and locks as marks
        if (s[3] !== 1) { const n = s[3] || 0, dots = n ? n : 3;
          for (let k = 0; k < dots; k++) { g.fillStyle = "#0b0c0e"; g.beginPath();
            g.arc(bx + bw * (k + 1) / (dots + 1), by + bh - 12 * u, Math.min(5 * u, bw / (dots * 3)), 0, 7); g.fill(); }
          if (!n) text("?", bx + bw / 2, by + bh - 30 * u, 18 * u, "#0b0c0e", 800, "center"); }
      } else { g.fillStyle = "#15171c"; g.fill(); }
      if (s[2]) { g.fillStyle = s[0] ? "#0b0c0e" : "#5c616c"; g.beginPath(); g.moveTo(bx + bw, by); g.lineTo(bx + bw - Math.min(22 * u, bw / 2), by);
        g.lineTo(bx + bw, by + Math.min(22 * u, bw / 2)); g.fill();
        if (bw > 60 * u) text(SEQ.chances[s[2]], bx + 8 * u, by + 16 * u, 18 * u, s[0] ? "#0b0c0e" : "#7c818c", 800); }
      if (s[4] || s[5]) { g.fillStyle = s[0] ? "#0b0c0e" : col; g.beginPath(); const cx = bx + 12 * u, cy = by + bh - 12 * u, r = Math.min(7 * u, bw / 5);
        g.moveTo(cx, cy - r); g.lineTo(cx + r, cy); g.lineTo(cx, cy + r); g.lineTo(cx - r, cy); g.fill(); }
      if (isSel && (L.selected || []).includes(i)) { rr(bx - 3 * u, by - 3 * u, bw + 6 * u, bh + 6 * u, 12 * u); g.strokeStyle = "#e8e9ec"; g.lineWidth = 3 * u; g.stroke(); }
      if (at === i) { rr(bx - 2 * u, by - 2 * u, bw + 4 * u, bh + 4 * u, 12 * u); g.strokeStyle = "#ffffff"; g.lineWidth = 4 * u; g.stroke(); }
    }
  });
  text("●  velocity = brightness      ◆  locks / step settings      ◤  chance      • • •  ratchet", pad, y1 - 4 * u, 22 * u, "#5c616c", 500);
}

function drawNotes(u, pad, y0, y1, L) {
  seqHeader(u, pad, y0, SEQ.title, SEQ.root + " " + SEQ.scale + "   " + SEQ.rate + "   " + SEQ.length + " STEPS" + (SEQ.per_note ? "   PER NOTE" : ""), "#4fb3ff");
  const notes = SEQ.notes, shown = L.shown || [];
  let lo = Math.min(...shown, ...notes.map(n => n[1])), hi = Math.max(...shown, ...notes.map(n => n[1]));
  if (!isFinite(lo)) { lo = 48; hi = 72; }
  lo = Math.max(0, lo - 2); hi = Math.min(127, hi + 2);
  while (hi - lo < 24) { if (lo > 0) lo--; if (hi - lo < 24 && hi < 127) hi++; if (lo === 0 && hi === 127) break; }
  const rows = hi - lo + 1, top = y0 + 80 * u, keysW = 160 * u, X0 = pad + keysW, X1 = W - pad;
  const cols = Math.max(16, SEQ.length), cw = (X1 - X0) / cols, rh = (y1 - top) / rows;
  const inScale = n => SEQ.degrees.includes(n % 12), black = n => [1, 3, 6, 8, 10].includes(n % 12);
  const sMin = Math.min(...shown), sMax = Math.max(...shown);
  for (let n = lo; n <= hi; n++) {
    const y = top + (hi - n) * rh;
    g.fillStyle = inScale(n) ? (n >= sMin && n <= sMax ? "#171a20" : "#121418") : "#0d0e11"; g.fillRect(X0, y, X1 - X0, rh - 1 * u);
    g.fillStyle = black(n) ? "#1f2228" : "#d6d8dc"; g.fillRect(pad, y, keysW - 50 * u, rh - 1 * u);
    if (L.lane === n) { g.fillStyle = "#4fb3ff"; g.fillRect(pad + keysW - 46 * u, y, 8 * u, rh - 1 * u); }
    if (n % 12 === 0 || rh > 34 * u) text(NAMES[n % 12] + (Math.floor(n / 12) - 1), pad + keysW - 56 * u, y + rh / 2, Math.min(24 * u, rh * 0.7),
      black(n) ? "#a3a8b3" : "#0b0c0e", 700, "right");
    if (shown.includes(n)) { g.fillStyle = "#4fb3ff"; g.fillRect(X0 - 8 * u, y + 2 * u, 5 * u, rh - 5 * u); }
  }
  // beats
  const spb = SEQ.spb || 4;
  for (let i = 0; i <= cols; i++) {
    const x = X0 + i * cw, beat = i % spb === 0, bar = i % Math.round(spb * (SEQ.bar_beats || 4)) === 0;
    g.fillStyle = bar ? "#3a3f48" : beat ? "#262a31" : "#16181d"; g.fillRect(x, top, bar ? 2 * u : 1 * u, y1 - top);
    if (bar && i < cols) text(String(i / Math.round(spb * (SEQ.bar_beats || 4)) + 1), x + 6 * u, top - 14 * u, 22 * u, "#5c616c", 600, "left", MONO);
  }
  g.fillStyle = "rgba(255,255,255,.04)"; g.fillRect(X0 + L.first * cw, top, Math.min(16, SEQ.length - L.first) * cw, y1 - top);
  if (SEQ.length < cols) { g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(X0 + SEQ.length * cw, top, (cols - SEQ.length) * cw, y1 - top); }
  for (const [step, note, len, vel, chance, ratchet, locks, comp] of notes) {
    if (note < lo || note > hi) continue;
    const x = X0 + step * cw + 2 * u, y = top + (hi - note) * rh + 2 * u, w = Math.max(6 * u, len * cw - 4 * u), h = Math.max(4 * u, rh - 5 * u);
    rr(x, y, w, h, Math.min(8 * u, h / 3));
    g.globalAlpha = 0.4 + 0.6 * (vel ? vel / 127 : 0.75); g.fillStyle = L.lane === note || L.lane === null || L.lane === undefined ? "#4fb3ff" : "#4fb3ff66"; g.fill(); g.globalAlpha = 1;
    if ((L.selected || []).includes(step) || (L.down || []).includes(step)) { g.strokeStyle = "#e8e9ec"; g.lineWidth = 3 * u; g.stroke(); }
    if (h > 18 * u && w > 30 * u) {
      let mark = (chance ? "◤" : "") + (ratchet !== 1 ? "×" + (ratchet || "?") : "") + (locks || comp ? "◆" : "");
      if (mark) text(mark, x + 6 * u, y + h / 2, Math.min(20 * u, h * 0.7), "#0b0c0e", 800);
    }
  }
  if (L.at !== null && L.at !== undefined) {
    const x = X0 + (L.at + 0.5) * cw; g.fillStyle = "#e8e9ec"; g.fillRect(x - 2 * u, top, 4 * u, y1 - top);
  }
}
