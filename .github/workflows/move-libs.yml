# Builds the Move's synths, drum machines, sound core and effects (all the .so files) in the cloud, for the
# Move's system (Ubuntu 22.04, 64-bit ARM), and publishes them as the "libs-latest" release.
# The Move downloads them with move/move-update.py: no Pi, no Mac.
# It runs on its own when the C/C++ code changes, or by hand: GitHub > Actions > Build Move libraries > Run workflow.
# 64-bit ARM is emulated here, so expect roughly 1-3 hours.
name: Build Move libraries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pi-app/core/**"
      - "pi-app/fx/**"
      - "pi-app/drums/**"
      - "pi-app/schwung/**"
      - "move/build-for-move.sh"
      - ".github/workflows/move-libs.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build everything for the Move
        run: DOCKER_PLATFORM=linux/arm64 bash move/build-for-move.sh
      - name: Publish as the libs-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view libs-latest >/dev/null 2>&1 || gh release create libs-latest --title "Move libraries" --notes "Built by GitHub Actions for the Ableton Move. Downloaded by move-update.py."
          gh release upload libs-latest "$HOME/move-libs.tgz" --clobber
